[package]
name = "cheatu-gui"
description = "Cross-platform (Wayland + X11) GUI for cheatu, built on egui/eframe."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cheatu-gui"
path = "src/main.rs"

[dependencies]
cheatu-core.workspace = true
cheatu-inject = { path = "../cheatu-inject" }
eframe = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }
serde_json = "1"
libc.workspace = true

# The native save/open panels: files picked there are reachable even when
# macOS privacy protection (TCC) blocks an elevated cheatu from the folder.
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }
