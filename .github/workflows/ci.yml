name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Upload the GUI binary for the packaging check
        uses: actions/upload-artifact@v4
        with:
          name: cheatu-gui
          path: target/release/cheatu-gui
          retention-days: 1

  # The AUR PKGBUILD can only be checked with Arch's own tools, and its
  # dependency list can only be checked against a built binary — the GUI
  # dlopens its windowing stack, so nothing links to it.
  packaging:
    name: AUR PKGBUILD
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install checking tools
        run: pacman -Sy --noconfirm --needed namcap libglvnd libx11 libxcb
             libxcursor libxi libxkbcommon libxkbcommon-x11 libxrender wayland
             fontconfig polkit

      - uses: actions/download-artifact@v4
        with:
          name: cheatu-gui
          path: target/release

      - name: Check the release metadata
        run: |
          # makepkg refuses to run as root, and the container has no other user.
          useradd -m build
          chown -R build .
          su build -c ./packaging/check-release.sh
