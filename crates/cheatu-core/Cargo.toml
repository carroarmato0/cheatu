[package]
name = "cheatu-core"
description = "Core memory scanning engine for cheatu (process listing, /proc/pid/maps parsing, memory read/write, scan engine, privilege helpers)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
memmap2 = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dev-dependencies]
proptest = "1"
